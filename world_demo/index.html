<section data-screen="welcome" id="welcome"><p class="eyebrow" data-fr="L’essentiel, votre regard sur le monde" data-en="The Brief, your window on the world"></p><h1 data-fr="Une base ivoirienne. Un horizon Monde." data-en="An Ivorian foundation. A world of perspectives."></h1><p class="lead" data-fr="La newsletter Côte d’Ivoire reste gratuite, en français et en anglais. L’Édition Monde est une offre payante distincte, au tarif à définir." data-en="The Côte d’Ivoire newsletter stays free in French and English. The World Edition is a separate paid plan, with pricing to be defined."></p><a class="button" href="#signup" data-fr="Découvrir le parcours" data-en="Explore the journey"></a><div class="editorial"><img src="/assets/editorial-1.png" alt="Illustration éditoriale générique / Generic editorial illustration"><p data-fr="Illustration générique validée, sans représentation d’un événement. Cette maquette ne constitue ni un abonnement réel ni une édition d’actualité." data-en="Approved generic illustration, not an event photograph. This demo is neither a real subscription nor a current news edition."></p></div><h2 data-fr="Un mail choisi. Un catalogue complet." data-en="A focused email. A complete catalogue."></h2><p data-fr="Avec Monde, vous sélectionnez les destinations de votre mail court. Votre accès à toutes les 31 éditions ne dépend pas de cette sélection." data-en="With World, choose the destinations in your short email. Your access to all 31 editions does not depend on this selection."></p></section>

<section data-screen="activation" id="activation" hidden><p class="eyebrow" data-fr="Simulation locale uniquement" data-en="Local simulation only"></p><h1 data-fr="Après paiement : activer Monde" data-en="After payment: activate World"></h1><p data-fr="Dans le produit futur, un paiement authentique et vérifié sera nécessaire. AUCUN PAIEMENT RÉEL ici : aucun prestataire, carte, transaction, webhook accepté ni facturation." data-en="The future product will require an authentic verified payment. NO REAL PAYMENT here: no provider, card, transaction, accepted webhook or billing."></p><label class="check"><input id="confirm-activation" type="checkbox"><span data-fr="Je confirme vouloir simuler l’activation après paiement, sans payer et sans souscrire réellement." data-en="I confirm I want to simulate activation after payment, without paying or really subscribing."></span></label><button id="activate" data-fr="SIMULATION — activer Monde sans paiement" data-en="SIMULATION — activate World without payment"></button><p id="activation-state"></p></section>
